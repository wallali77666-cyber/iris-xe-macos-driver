name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Everything heavy happens on GitHub's macOS machines — no local Mac and no local
  # downloads are needed to compile the kernel extensions.
  kexts-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && xcrun clang++ --version | head -1
      - name: Build kexts + plugin
        run: sh build/build_all.sh
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: iris-xe-build
          path: build/out/
          if-no-files-found: error

  # The sniffer is Windows-only; this job proves it runs end-to-end on a clean machine.
  irisprobe-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate + run IrisProbe
        shell: pwsh
        run: |
          python -m py_compile tools/irisprobe/irisprobe.py
          python tools/irisprobe/irisprobe.py
      - name: Plan display registers from the sniffed panel (ixplan)
        shell: pwsh
        run: python tools/ixplan/ixplan.py --report reports/irisprobe-report.json
      - name: Upload sniffer report
        uses: actions/upload-artifact@v4
        with:
          name: irisprobe-report
          path: reports/
          if-no-files-found: warn
