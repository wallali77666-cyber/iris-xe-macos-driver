name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Everything heavy happens on GitHub's macOS machines — no local Mac and no local
  # downloads are needed to compile the kernel extensions.
  kexts-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && xcrun clang++ --version | head -1
      - name: Build kexts + plugin
        run: sh build/build_all.sh
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: iris-xe-build
          path: build/out/
          if-no-files-found: error

  # The sniffer is Windows-only; this job proves it runs end-to-end on a clean machine.
  irisprobe-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate + run IrisProbe
        shell: pwsh
        run: |
          python -m py_compile tools/irisprobe/irisprobe.py
          python tools/irisprobe/irisprobe.py
      - name: Plan display registers from the sniffed panel (ixplan)
        shell: pwsh
        run: python tools/ixplan/ixplan.py --report reports/irisprobe-report.json
      - name: Upload sniffer report
        uses: actions/upload-artifact@v4
        with:
          name: irisprobe-report
          path: reports/
          if-no-files-found: warn

  # ixcheck tooling: shell syntax + comparator self-test against synthetic ground truth
  # (the real capture session happens later, on the target laptop's Linux live USB).
  ixcheck-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture script syntax + help
        run: |
          bash -n tools/ixcheck/ixcheck.sh
          bash tools/ixcheck/ixcheck.sh --help
      - name: Comparator self-test (synthetic i915 capture vs ixplan vs IXFB log)
        run: python3 tools/ixcheck/test_compare.py
      - name: All shell scripts parse
        run: |
          for f in build/*.sh tools/efi/assemble.sh tools/ixcheck/ixcheck.sh \
                   tools/ixgen/fetch_i915.sh package/*.sh; do
            bash -n "$f" && echo "parsed: $f"
          done

  # ixgen: fetch the pinned i915 hardware facts IXRM is built on and extract the
  # GGTT/paging sections. The job log + the small extract artifact are the audit
  # trail: no register value in the driver may be guessed. Nothing fetched here
  # is committed to the tree — this runs purely in CI.
  ixgen-linux:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + extract pinned i915 facts (v6.12 = the capture kernel)
        run: bash tools/ixgen/fetch_i915.sh v6.12 i915-ref
      - name: Upload the provenance-stamped extract (small)
        uses: actions/upload-artifact@v4
        with:
          name: i915-ref-extract
          path: i915-ref/extract.txt
          if-no-files-found: error
